<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTMLEON – Model Viewer</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js" defer integrity="sha384-T4vc5AP9W2o3EVVQC6Is5mbKqFE2eysxg1XHwaZLquK0SjtY+4cLHoN3j1mK/MmB" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js" defer integrity="sha384-Dr98ddmUw2QkdCarNQ+OL7xLty7cSxgR0T7v1tq4UErS/qLV0132sBYTolRAFuOV" crossorigin="anonymous"></script>
  <script>
    const YOUR_PUBLIC_URL = 'https://somethingembarrassing.github.io/HTMLEON/';
  </script>
  <script src="models.js"></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Gallery view -->
  <section id="gallery" class="view">
    <header class="site-header">
      <h1>Model Library</h1>
      <p class="subtitle">Select a model to view in 3D or launch AR on mobile</p>
    </header>
    <div class="card-grid" id="cardGrid">
      <!-- Cards injected by script.js -->
    </div>
  </section>

  <!-- Viewer view -->
  <section id="viewer" class="view hidden">
    <header class="viewer-header">
      <button id="backBtn" class="back-btn" type="button">&#8592; All models</button>
      <h2 id="viewerTitle"></h2>
    </header>

    <div class="viewer-wrap">
      <model-viewer
        id="model"
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        environment-image="neutral"
        alt="3D model">
        <div class="spinner" slot="progress-bar"></div>
      </model-viewer>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span>Loading model…</span>
      </div>
    </div>

    <div class="instructions">
      Tap the AR button (on mobile), or scan the QR code from your phone to launch AR.
    </div>

    <div class="qr-container" id="qrContainer">
      <div>Scan on your phone to view this model in AR:</div>
      <canvas id="qrcode"></canvas>
    </div>
  </section>

</body>
</html>
